name: Build Android ARM64 binaries

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build Linux ARM64 binaries
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -buildmode=pie -trimpath -ldflags="-s -w" -o dist/tunnel-client ./cmd/client
          go build -buildmode=pie -trimpath -ldflags="-s -w" -o dist/tunnel-client-runtime ./cmd/client-runtime
          go build -buildmode=pie -trimpath -ldflags="-s -w" -o dist/tunnel-client-runtime-cloudflared ./cmd/client-runtime-cloudflared

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: tunnel-client-linux-arm64
          path: dist/*
          if-no-files-found: error
          retention-days: 7
